<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Junior Thuram Nana · Founder of SIGIL SARL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C10"/>
      <stop offset="50%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#3b82f6" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Hex lattice motif -->
  <g transform="translate(900, 315)" opacity="0.5">
    <g fill="none" stroke="#00E5FF" stroke-width="1.2">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
    </g>
    <g fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.7">
      <polygon points="0,-78 67,-39 67,39 0,78 -67,39 -67,-39"/>
    </g>
    <g fill="none" stroke="#3b82f6" stroke-width="0.9" opacity="0.5">
      <polygon points="0,-138 119,-69 119,69 0,138 -119,69 -119,-69"/>
    </g>
    <g fill="none" stroke="#4f46e5" stroke-width="0.7" opacity="0.3">
      <polygon points="0,-198 171,-99 171,99 0,198 -171,99 -171,-99"/>
    </g>
    <g fill="#00E5FF" opacity="0.85">
      <circle cx="0" cy="0" r="4"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#3b82f6" opacity="0.7">
    <text x="80" y="110" font-size="15" letter-spacing="4">SIGIL SARL · SOVEREIGN GOVERNANCE INFRASTRUCTURE</text>
  </g>

  <!-- Name -->
  <g font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900">
    <text x="78" y="238" font-size="82" fill="#FFFFFF" letter-spacing="-2">Junior</text>
    <text x="78" y="330" font-size="82" fill="url(#cyan)" letter-spacing="-2">Thuram Nana</text>
  </g>

  <!-- Role -->
  <g font-family="'Inter', system-ui, sans-serif">
    <text x="80" y="400" font-size="26" font-weight="700" fill="#FFFFFF" opacity="0.9">Founder &amp; Managing Director, SIGIL SARL</text>
    <text x="80" y="438" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.55">Software engineer &amp; security researcher · Buea, Cameroon</text>
  </g>

  <!-- Systems -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#00E5FF" opacity="0.8">
    <text x="80" y="505" font-size="18" letter-spacing="3">VIGIL · RÉCOR · APEX</text>
  </g>

  <!-- Footer -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#D4AF37" opacity="0.6">
    <text x="80" y="580" font-size="13" letter-spacing="3">thuramnana.com · sigilsovereign.com</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00E5FF" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M 40 40 L 60 40 L 60 60"/>
    <path d="M 1140 40 L 1160 40 L 1160 60"/>
    <path d="M 40 590 L 40 570 L 60 570"/>
    <path d="M 1160 590 L 1160 570 L 1140 570"/>
  </g>

  <g fill="#3b82f6" opacity="0.7">
    <rect x="80" y="128" width="40" height="2"/>
  </g>
</svg>
