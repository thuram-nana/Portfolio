          <h1>Junior Thuram Nana — Founder of SIGIL SARL</h1>
          <p class="muted">Software engineer &amp; security researcher · Buea, Cameroon</p>
          <p>
            I'm a self-taught software engineer and security researcher, and the founder and managing
            director of <strong>SIGIL SARL</strong> (Sovereign Integrity Governance Infrastructure Labs),
            a GovTech and RegTech company I started in 2023. SIGIL builds sovereign governance
            infrastructure for public institutions, banks, and companies — systems where the institution
            holds the keys and data, and every consequential action is authorized, bounded, and proven.
          </p>

          <h2>The doctrine I build by</h2>
          <ul>
            <li>A technical capability is never treated as authorization.</li>
            <li>No finding is trusted until it is independently re-verified.</li>
            <li>The institution can always read, export, and stop.</li>
          </ul>

          <h2>SIGIL — three systems</h2>
          <ul>
            <li><strong>VIGIL</strong> — a governed cybersecurity and evidence platform. Status: paid pilot.</li>
            <li><strong>RÉCOR</strong> — a sovereign beneficial-ownership registry built to the Beneficial Ownership Data Standard (BODS v0.4); demonstrated to and acknowledged by Open Ownership in July 2026. Status: pre-deployment.</li>
            <li><strong>APEX</strong> — anti-corruption intelligence for public procurement. Status: pre-deployment.</li>
          </ul>
          <p>More at <a href="https://sigilsovereign.com">sigilsovereign.com</a>.</p>

          <h2>Security research</h2>
          <ul>
            <li>Responsible disclosure to Meta / WhatsApp — an iOS group-permission logic bypass (2024, patched).</li>
            <li>Responsible disclosure to Samsung — a clipboard-to-dialpad character-injection flaw (2025, reported).</li>
          </ul>
